name: feasta
description: "A catering and event booking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
    
  custom_refresh_indicator: ^4.0.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  cloud_functions: ^6.3.3
  google_sign_in: ^7.2.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.2
  pinput: ^6.0.2
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  rxdart: ^0.28.0
  google_fonts: ^6.2.0
  fl_chart: ^1.2.0
  firebase_storage: ^13.4.5
  firebase_app_check: ^0.4.5+2
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  flutter_svg: ^2.3.0
  vector_graphics: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  vector_graphics_compiler: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/feasta_native_icon.png"
  image_path_android: "assets/branding/feasta_android_icon.png"
  adaptive_icon_background: "assets/branding/feasta_icon_background.png"
  adaptive_icon_foreground: "assets/branding/feasta_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#093B26"

flutter_native_splash:
  color: "#F7F8F8"
  android: true
  ios: true
  web: false
  fullscreen: true
  image: assets/branding/feasta_static_splash.png

  android_12:
    color: "#F7F8F8"
    image: assets/branding/feasta_android12_splash.png
